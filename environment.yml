# Conda environment for developing and running foresight_gpu.
#
#   conda env create -f environment.yml
#   conda activate foresight_gpu
#
# The pip section installs the package in editable mode with its dev extras,
# which also pulls `forecast-performance` from PyPI.
name: foresight_gpu
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - matplotlib>=3.7
  - scikit-learn>=1.3
  - joblib>=1.3
  - pip
  - pip:
      - -e .[dev]
